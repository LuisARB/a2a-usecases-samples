[project]
name = "teams-a2a-agent"
version = "0.1.0"
description = "A Microsoft Teams echo bot"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "dotenv>=0.9.9",
  "microsoft-teams-a2a",
  "microsoft-teams-apps",
  "microsoft-teams-devtools"
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
