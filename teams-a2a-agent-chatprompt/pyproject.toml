[project]
name = "teams-a2a-agent-chatprompt"
version = "0.1.0"
description = "A Microsoft Teams bot using A2A protocol with ChatPrompt and A2AClientPlugin"
authors = [{ name = "Demo", email = "demo@example.com" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "python-dotenv>=1.0.0",
  "microsoft-teams-apps",
  "microsoft-teams-ai",
  "microsoft-teams-a2a",
  "microsoft-teams-openai",
  "microsoft-teams-devtools"
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
